
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 30px;
        }

        header {
            text-align: center;
            color: #17365d;
        }

        main {
            max-width: 500px;
            margin: 20px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #17365d;
            color: white;
            border: none;
            cursor: pointer;
        }

        footer {
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Please fill in your details below.</p>
    </header>

    <main>
        <section>
            <form action="#" method="post">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>

                <label for="matric">Matriculation Number:</label>
                <input type="text" id="matric" name="matric"
                       placeholder="Enter your matric number" required>

                <label for="department">Department:</label>
                <select id="department" name="department" required>
                    <option value="">Select Department</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Information Communication Technology">
                        Information Communication Technology
                    </option>
                    <option value="Software Engineering">Software Engineering</option>
                    <option value="Cyber Security">Cyber Security</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Information System">Information System</option>
                </select>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email address" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number" required>

                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label for="programme">Programme:</label>
                <select id="programme" name="programme" required>
                    <option value="">Select Programme</option>
                    <option value="Full-time">Full-time</option>
                    <option value="Weekday">Weekday</option>
                    <option value="Weekend">Weekend</option>
                </select>

                <button type="submit">Submit</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Student Registration Portal</p>
    </footer>

</body>
</html>
